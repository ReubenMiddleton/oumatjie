name: CI

# Build and unit-test on every push and pull request. This is the project's first real CI —
# see docs/DECISIONS.md's "No CI/CD" gap. Deliberately does not sign or publish anything (no
# signing key is stored as a secret here — see docs/DECISIONS.md's "No production signing key").
#
# Known possible first-run gap, not a code problem: as of the 2026-08-17 session,
# `compileSdk = 37` in app/build.gradle.kts hadn't yet been published to Google's SDK
# repository (only build-tools 37.0.0 was). If the very first run of this workflow fails at
# the SDK-download step rather than at compiling Oumatjie's own code, that's most likely this
# same pre-existing gap, not a regression — check docs/DECISIONS.md's "Android SDK Platform 37
# isn't published to Google's SDK repository yet" entry before assuming something broke.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/reports/tests/"
          retention-days: 14
