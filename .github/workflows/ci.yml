name: CI

# Build and unit-test on every push and pull request. This is the project's first real CI —
# see docs/DECISIONS.md's "No CI/CD" gap. Deliberately does not sign or publish anything (no
# signing key is stored as a secret here — see docs/DECISIONS.md's "No production signing key").
#
# Resolved 2026-08-25 (was: "compileSdk = 37 isn't published yet"). Google has since published
# `platforms;android-37.0` and `android-37.1`, and this workflow builds green against
# `compileSdk = 37`. Note the package is named `android-37.0`, not `android-37`. A *local* build
# on the original dev machine can still fail to find it, because that machine has the deprecated
# `tools/bin/sdkmanager`, which cannot see modern packages — that's a local tooling gap, not a
# CI or code problem. See AGENTS.md and docs/DECISIONS.md's entry for 2026-08-25.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Static analysis and formatting, added 2026-08-25 (docs/TOOLING.md item 3). detekt runs
      # against config/detekt/baseline.xml, which records the 45 pre-existing issues found when
      # these tools were first introduced — so this step fails on NEW issues only, not on the
      # backlog. ktlint had zero violations in Kotlin source when added; it is not baselined.
      # Run before the tests so a formatting failure is reported fast.
      - name: Static analysis (detekt + ktlint)
        run: ./gradlew detekt ktlintCheck --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/reports/tests/"
          retention-days: 14
