name: Instrumented tests

# Runs app/src/androidTest on a real emulator. Added 2026-08-25 alongside
# AccessibilitySemanticsTest, which is the reason this workflow exists: that suite asserts the
# accessibility guarantees this project has committed to (heading semantics, the "Unread" text
# label) and could never verify from outside the app. A test that isn't run doesn't guarantee
# anything, so it needs to be enforced somewhere, not just runnable on request.
#
# Deliberately a separate workflow rather than another step in ci.yml: booting an emulator takes
# several minutes, and ci.yml's job is fast feedback on every push. Keeping them apart means a
# Kotlin compile error still fails in ~2 minutes rather than ~12.
#
# If this becomes a nuisance (runner flakiness rather than real failures), narrow the `on:` trigger
# to pull_request only rather than deleting the workflow — the guarantee is worth keeping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push while this is still running cancels the first — emulator jobs are slow and there
# is no value in finishing a run against superseded code.
concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  androidTest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Hardware acceleration. Without this the emulator falls back to software rendering and the
      # job takes long enough to hit the timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # API 34 rather than the 36 used locally: minSdk is 28, these tests exercise no
      # version-specific behaviour, and 34 images boot most reliably on hosted runners.
      # `disable-animations` matters — Compose's test clock can otherwise wait on animations that
      # never settle, and this app deliberately animates its inbox list.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
